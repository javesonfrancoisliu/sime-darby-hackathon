name: ci

on:
  pull_request:
  push:
    branches: [main]

# Checks only; deploys stay local (infra/scripts/deploy.sh).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "$DYNAMODB_ENDPOINT"; then exit 0; fi
            sleep 1
          done
          echo "DynamoDB Local did not start" >&2
          exit 1
      # Keep heavy tasks within the shared runner capacity while lint and formatting run alongside.
      - name: Checks
        run: |
          fail=0
          pnpm lint & lint=$!
          pnpm format:check & format=$!
          pnpm exec turbo run typecheck build test --concurrency=2 & turbo=$!
          wait "$lint" || fail=1
          wait "$format" || fail=1
          wait "$turbo" || fail=1
          exit "$fail"
